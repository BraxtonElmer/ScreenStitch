[package]
name = "screenstitch-platform"
description = "Windows side of ScreenStitch shared by the tray app and the settings window: monitor detection, EDID, config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
screenstitch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
