[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/tray", "settings/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BraxtonElmer/ScreenStitch"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
